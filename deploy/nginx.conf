# Konfigurasi untuk container halaman ini.
#
# Halaman dilayani di bawah xixlabs.net/bgremover. Server pengarah di landing
# pusat melepas prefix itu sebelum meneruskan permintaan ke sini, sehingga
# container ini menerima path tanpa prefix. Aset hasil build tetap memakai
# alamat /bgremover/assets/... di sisi pengunjung, dan itu sudah sejalan
# karena prefix dilepas di sisi pengarah.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Aset hasil build memakai nama berisi hash, sehingga aman disimpan lama.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    # Model files for the offline engine, fetched same-origin so the vendor
    # host never appears in the browser. Forwarded to the model host; set
    # VITE_MODEL_HOST at build time to serve them from an own mirror instead.
    location ^~ /m/ {
        proxy_ssl_server_name on;
        proxy_set_header Host huggingface.co;
        proxy_pass https://huggingface.co/;
        proxy_hide_header "Set-Cookie";
        expires 30d;
        add_header Cache-Control "public";
    }
    # Aset lain seperti favicon tidak memakai hash, jadi tidak boleh disimpan
    # selama aset berhash.
    location ~* \.(?:css|js|json|ico|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

