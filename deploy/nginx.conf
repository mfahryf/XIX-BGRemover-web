# Konfigurasi untuk container halaman ini.
#
# Halaman dilayani di bawah xixlabs.net/bgremover. Server pengarah di landing
# pusat melepas prefix itu sebelum meneruskan permintaan ke sini, sehingga
# container ini menerima path tanpa prefix. Aset hasil build tetap memakai
# alamat /bgremover/assets/... di sisi pengunjung, dan itu sudah sejalan
# karena prefix dilepas di sisi pengarah.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Aset hasil build memakai nama berisi hash, sehingga aman disimpan lama.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    # Berkas model untuk mesin offline, diambil dari origin sendiri supaya host
    # vendor tidak muncul di browser. Diteruskan ke host model; isi
    # VITE_MODEL_HOST saat build untuk menyajikannya dari cermin sendiri.
    #
    # Berkas kecil seperti config.json dijawab dengan pengalihan ke
    # /api/resolve-cache/... yang Location-nya relatif. Tanpa penulisan ulang,
    # browser menyelesaikannya terhadap domain kita sendiri dan berkasnya 404,
    # sementara berkas besar dialihkan ke CDN vendor dengan alamat mutlak dan
    # dibiarkan lewat apa adanya.
    location ^~ /m/ {
        proxy_ssl_server_name on;
        proxy_set_header Host huggingface.co;
        proxy_pass https://huggingface.co/;
        proxy_redirect ~^/(.*)$ /m/$1;
        proxy_hide_header "Set-Cookie";
        expires 30d;
        add_header Cache-Control "public";
    }
    # Aset lain seperti favicon tidak memakai hash, jadi tidak boleh disimpan
    # selama aset berhash.
    location ~* \.(?:css|js|json|ico|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

